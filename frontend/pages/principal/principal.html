<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tela Principal</title>
    <link rel="stylesheet" href="css/style.css?v=20260413b" />
  </head>
  <body class="page-app">
    
    <header class="site-header">
      <div class="header-top container">
        <div class="branding">
          <img src="images/logomr.png" alt="MR Rações" class="logo-img" onerror="this.style.display='none'" />
          <div class="logo-badge">MR</div>
        </div>

        <form class="search" action="principal.html" method="get" role="search">
          <input type="search" name="q" placeholder="Buscar produtos, marcas ou categorias" aria-label="Buscar" />
          <button type="submit" class="search-btn"><img src="images/buscar.png" alt="Buscar"></button>
        </form>

        <div class="user-actions">
          <div class="user-auth">
            <div class="user-avatar">
              <img src="images/pfpuser.png" alt="Avatar" class="avatar-img" />
            </div>
            <div class="user-info">
              <span class="user-name" data-user-name>Entre ou cadastre-se</span>
              <a href="login.html" class="auth-link" data-auth-link>Entrar</a>
            </div>
          </div>
          <a class="icon-link favorites-link" href="favoritos.html" aria-label="Favoritos">
            <img src="images/favorite.png" alt="Favoritos">
            <span class="cart-badge" data-favorite-badge>0</span>
          </a>
          <a class="icon-link cart-link" href="carrinho.html" aria-label="Carrinho">
            <img src="images/carrinho.png" alt="Carrinho">
            <span class="cart-badge" data-cart-badge>0</span>
          </a>
        </div>
      </div>

    </header>

    <nav class="category-bar">
      <div class="container categories">
        <button class="icon-btn menu-toggle" type="button" data-sidebar-toggle><img src="images/menu.png" alt="Menu"></button>
        <ul class="category-list">
          <li><a href="principal.html?cat=all">Todos</a></li>
          <li><a href="principal.html?cat=cachorros">Cachorros</a></li>
          <li><a href="principal.html?cat=gatos">Gatos</a></li>
          <li><a href="principal.html?cat=passaros">Pássaros</a></li>
          <li><a href="principal.html?cat=peixes">Peixes</a></li>
          <li><a href="principal.html?cat=outros">Outros Pets</a></li>
          <li><a href="principal.html?cat=promocoes">Promoções</a></li>
        </ul>
      </div>
    </nav>

    <div class="overlay" data-overlay></div>

    <div class="layout">
      <aside class="sidebar" data-sidebar>
        <nav class="menu" role="navigation">
          <a class="menu-item" href="principal.html">
            <span class="menu-icon"><img src="images/home.png" alt="Home"></span>
            <span class="menu-text">Página Inicial</span>
          </a>
          <a class="menu-item" href="principal.html?q=" >
            <span class="menu-icon"><img src="images/buscar.png" alt="Pesquisar"></span>
            <span class="menu-text">Pesquisar</span>
          </a>
          <a class="menu-item" href="#" id="consultarBtn">
            <span class="menu-icon"><img src="images/chat.png" alt="Consultar"></span>
            <span class="menu-text">Consultar</span>
          </a>
          <a class="menu-item" href="#" data-price-filters-toggle aria-expanded="false" aria-controls="price-filters-panel">
            <span class="menu-icon"><img src="images/preço.png" alt="Preços"></span>
            <span class="menu-text">Preços</span>
          </a>
          <div class="price-filters-panel" id="price-filters-panel" data-price-filters-panel hidden>
            <div class="price-filter-group">
              <p class="price-filter-title">Faixa de preço</p>
              <div class="price-filter-row">
                <input type="number" min="0" step="0.01" placeholder="Mín" data-filter-price-min />
                <input type="number" min="0" step="0.01" placeholder="Máx" data-filter-price-max />
              </div>
            </div>

            <div class="price-filter-group">
              <p class="price-filter-title">Tipo de pet</p>
              <label class="price-filter-check"><input type="checkbox" value="cachorros" data-filter-pet-type /> Cachorro</label>
              <label class="price-filter-check"><input type="checkbox" value="gatos" data-filter-pet-type /> Gato</label>
              <label class="price-filter-check"><input type="checkbox" value="peixes" data-filter-pet-type /> Peixe</label>
              <label class="price-filter-check"><input type="checkbox" value="passaros" data-filter-pet-type /> Pássaro</label>
              <label class="price-filter-check"><input type="checkbox" value="outros" data-filter-pet-type /> Outros</label>
            </div>

            <button class="price-filter-clear" type="button" data-filter-clear>Limpar filtros</button>
          </div>
          <a class="menu-item" href="perfil.html">
            <span class="menu-icon"><img src="images/user-black.png" alt="Perfil"></span>
            <span class="menu-text">Perfil</span>
          </a>
          <a class="menu-item" href="#" data-logout>
            <span class="menu-icon"><img src="images/sair.png" alt="Sair"></span>
            <span class="menu-text">Sair</span>
          </a>
        </nav>
      </aside>

      <main class="content">
        
        <section class="carousel" data-carousel>
          <div class="carousel-track">
            <article class="slide" data-src="images/carrossel1.png">
              <div class="slide-media" style="background-image: url('images/carrossel1.png')"></div>
            </article>

            <article class="slide" data-src="images/carrossel2.png">
              <div class="slide-media" style="background-image: url('images/carrossel2.png')"></div>
            </article>

            <article class="slide" data-src="images/carrossel3.png">
              <div class="slide-media" style="background-image: url('images/carrossel3.png')"></div>
            </article>

            <article class="slide" data-src="images/carrossel4.png">
              <div class="slide-media" style="background-image: url('images/carrossel4.png')"></div>
            </article>

            <article class="slide" data-src="images/carrossel5.png">
              <div class="slide-media" style="background-image: url('images/carrossel5.png')"></div>
            </article>

            <article class="slide" data-src="images/carrossel6.jpg">
              <div class="slide-media" style="background-image: url('images/carrossel6.jpg')"></div>
            </article>

            <article class="slide" data-src="images/carrossel7.jpg">
              <div class="slide-media" style="background-image: url('images/carrossel7.jpg')"></div>
            </article>

            <article class="slide" data-src="images/carrossel8.jpg">
              <div class="slide-media" style="background-image: url('images/carrossel8.jpg')"></div>
            </article>

            <article class="slide" data-src="images/carrossel9.jpg">
              <div class="slide-media" style="background-image: url('images/carrossel9.jpg')"></div>
            </article>

            <article class="slide" data-src="images/carrossel10.jpg">
              <div class="slide-media" style="background-image: url('images/carrossel10.jpg')"></div>
            </article>
          </div>

          <div class="carousel-dots" aria-hidden="false"></div>
        </section>

        <section class="grid products">
          <!-- Os cards de produto serão renderizados dinamicamente via JavaScript -->
        </section>
      </main>
    </div>

    <!-- Modal de Pesagem -->
    <div class="weight-modal-overlay" id="weightModalOverlay">
      <div class="weight-modal">
        <div class="weight-modal-header">
          <h3 class="weight-modal-title" id="weightModalTitle">Pesar Ração</h3>
          <button class="weight-modal-close" type="button" id="weightModalClose" aria-label="Fechar">&times;</button>
        </div>

        <div class="weight-modal-tabs">
          <button class="weight-tab-btn active" data-tab="by-weight">Por kg</button>
          <button class="weight-tab-btn" data-tab="by-price">Por R$</button>
        </div>

        <div class="weight-modal-body">
          <div class="weight-info">
            <p class="weight-product-name" id="weightProductName">Ração SuperMix</p>
            <div class="weight-pricing-display">
              <span class="price-per-kg" id="pricePerKg">R$ 75,00 por kg</span>
            </div>
          </div>

          <!-- TAB: Por kg -->
          <div class="weight-tab-content active" data-tab="by-weight">
            <div class="weight-input-group">
              <label for="weightInputKg" class="weight-label">Quantidade (kg):</label>
              <input 
                type="number" 
                id="weightInputKg" 
                class="weight-input" 
                min="0.1" 
                max="100" 
                step="0.1" 
                placeholder="Digite o peso em kg"
                value="1"
              >
            </div>

            <div class="weight-total-price">
              <span class="weight-total-label">Total:</span>
              <span class="weight-total-value" id="weightTotalPrice">R$ 75,00</span>
            </div>
          </div>

          <!-- TAB: Por R$ -->
          <div class="weight-tab-content" data-tab="by-price">
            <div class="weight-input-group">
              <label for="weightInputPrice" class="weight-label">Valor em R$:</label>
              <input 
                type="number" 
                id="weightInputPrice" 
                class="weight-input" 
                min="0.01" 
                max="10000" 
                step="0.01" 
                placeholder="Digite o valor em reais"
                value="75.00"
              >
            </div>

            <div class="weight-total-price">
              <span class="weight-total-label">Você receberá:</span>
              <span class="weight-total-value" id="weightTotalWeight">1.00 kg</span>
            </div>
          </div>
        </div>
        
        <div class="weight-modal-actions">
          <button class="btn secondary" type="button" id="weightModalCancel">CANCELAR</button>
          <button class="btn primary" type="button" id="weightModalAddCart">ADICIONAR AO CARRINHO</button>
        </div>
      </div>
    </div>

    <!-- Chat Widget -->
    <button class="chat-widget-button" id="chatWidgetBtn">
      <img src="images/bolt.jpg" alt="BOLT" class="chat-widget-icon">
    </button>
    
    <div class="chat-widget" id="chatWidget">
        <div class="chat-header">
          <h1>BOLT</h1>
            <button class="chat-close-btn" id="chatCloseBtn">✕</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="Sua mensagem...">
            <button class="chat-send-btn" id="chatSendBtn">→</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js?v=20260413b"></script>
    <script src="js/consultarBot.js"></script>
  </body>
  <!-- Scripts para renderização dinâmica dos cards -->
  <script src="js/products-data.js"></script>
  <script src="js/render-products.js?v=20260413b"></script>
</html>
