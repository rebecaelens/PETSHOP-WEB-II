<article class="product-card" data-product data-category="{{category}}" data-promocao="{{promocao}}" data-price-per-kg="{{pricePerKg}}" id="{{id}}">
  <div class="product-media" style="background-image:url('{{image}}')"></div>
  <div class="product-body">
    <button class="fav-btn" type="button" data-favorito aria-label="Favoritar"><img src="images/favorite.png" alt="Favoritar"></button>
    {{#if promocao}}
    <img src="images/venda.png" alt="Promoção" class="sale-badge">
    {{/if}}
    <h4 class="product-title">{{title}}</h4>
    <p class="product-desc">{{description}}</p>
    {{#if priceOriginal}}
    <div class="product-price-original">
      <span class="price-currency">R$</span> <span class="price-value">{{priceOriginal}}</span>
    </div>
    {{/if}}
    <div class="product-price{{#if promocao}} product-price-promo{{/if}}"><span class="price-currency">R$</span> <span class="price-value">{{price}}</span></div>
    <div class="product-actions">
      {{#if pricePerKg}}
      <button class="btn secondary" type="button" data-pesar>PESAR</button>
      {{/if}}
      <button class="btn primary" type="button" data-carrinho>COMPRAR</button>
    </div>
  </div>
</article>
